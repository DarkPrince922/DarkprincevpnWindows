# Релиз: собирает установщик и выкладывает его в раздел Releases.
#
# Запустить можно двумя способами — повесить тег вида v1.0.0 либо нажать
# «Run workflow» и ввести версию руками. Второй способ нужен не для красоты:
# тег создаётся тогда самим прогоном, из коммита, на котором его запустили.
#
# Сборка повторяет шаги из tauri.yml намеренно. Свести их в одну можно, но
# тогда релиз зависел бы от чужого прогона и от того, что артефакт ещё не
# протух.

name: Релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например v1.0.0"
        required: true

# нужно, чтобы прогон мог создать релиз и приложить к нему файл
permissions:
  contents: write

jobs:
  release:
    name: Собрать и опубликовать
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri/src-tauri

      - name: Скачать ядро и мост
        shell: pwsh
        run: ./scripts/fetch-cores.ps1 -OutputDirectory app-tauri/src-tauri/core

      # Версия приложения должна совпасть с тегом: именно её оно сравнивает с
      # манифестом обновлений. Отстанет — апдейтер будет предлагать одно и то
      # же обновление по кругу.
      - name: Проставить версию
        shell: pwsh
        run: ./scripts/set-version.ps1 -Version $env:TAG

      - name: Собрать
        working-directory: app-tauri/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Подготовить установщик
        id: installer
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $source = Get-ChildItem app-tauri/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          if (-not $source) { Write-Error "установщик не собрался"; exit 1 }

          # Имя от Tauri содержит пробелы — по ссылке такое неудобно
          $file = "DarkPrinceVPN-$version-setup.exe"
          Copy-Item $source.FullName $file

          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round($source.Length / 1MB, 1)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "file=$file"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size=$size"

          # Обратные кавычки в тексте не используем: в PowerShell это знак
          # экранирования, и разметка сломала бы сам скрипт. Отступ в четыре
          # пробела даёт тот же блок кода.
          @"
          Установщик для Windows 10 и 11, 64 бита. Размер $size МБ.

          Ядро Xray, мост tun2socks и wintun.dll входят в установщик — ничего
          доскачивать не нужно.

          Программа не подписана сертификатом, поэтому при первом запуске
          Windows покажет предупреждение SmartScreen: «Подробнее» →
          «Выполнить в любом случае».

          Проверить, что файл скачался целиком:

              certutil -hashfile $file SHA256

          Должно получиться: $hash
          "@ | Set-Content notes.md -Encoding utf8

      - name: Опубликовать
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target нужен, когда тега ещё нет: релиз создаст его сам,
          # на том коммите, из которого собирались
          gh release create "$env:TAG" `
            "${{ steps.installer.outputs.file }}" `
            --target "${{ github.sha }}" `
            --title "DarkPrince VPN $env:TAG" `
            --notes-file notes.md
