name: Build Tauri

on:
  push:
    branches: [main]
    paths:
      - "app-tauri/**"
      - ".github/workflows/tauri.yml"
  pull_request:
    paths:
      - "app-tauri/**"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Проверить движок
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Тесты движка
        working-directory: app-tauri/engine
        run: cargo test

  build:
    name: Собрать приложение
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri/src-tauri

      - name: Скачать ядро и мост
        shell: pwsh
        run: ./scripts/fetch-cores.ps1 -OutputDirectory app-tauri/src-tauri/core

      - name: Собрать
        working-directory: app-tauri/src-tauri
        # Обычный CI проверяет приложение и установщик, но не выпускает
        # обновление. Подписанные updater-артефакты создаёт только release.yml,
        # где ключ доступен из secrets.
        run: npx --yes @tauri-apps/cli@^2 build --config tauri.ci.conf.json

      - name: Проверить состав сборки
        shell: pwsh
        run: |
          $exe = "app-tauri/src-tauri/target/release/darkprince-vpn.exe"
          if (-not (Test-Path $exe)) { Write-Error "не собрался exe"; exit 1 }
          Get-ChildItem app-tauri/src-tauri/target/release/bundle -Recurse -Include *.exe |
            Select-Object FullName, Length | Format-Table

      - uses: actions/upload-artifact@v4
        with:
          name: DarkPrinceVPN-tauri
          path: |
            app-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
